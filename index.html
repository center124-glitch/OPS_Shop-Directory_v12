<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<title>SBK Directory · ทำเนียบร้านค้า Seacon Bangkae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   DESIGN TOKENS
   คอนเซปต์: "Elevator Panel" — แต่ละชั้นของห้าง มีสีประจำชั้น
   เหมือนปุ่มลิฟต์จริง กดแล้วติดไฟ เพื่อให้จำง่ายและสนุกขึ้น
══════════════════════════════════════════════════════════ */
:root{
  --bg:#F6F7FB; --surface:#ffffff; --surface2:#F0F1F6; --surface3:#E7E9F0;
  --border:#E2E4ED; --t1:#12131A; --t2:#4B4D5C; --t3:#8688A0; --t4:#B8BACC;
  --mono:'JetBrains Mono',monospace; --disp:'Kanit',system-ui,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1); --sp:cubic-bezier(.34,1.56,.64,1);
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --s1:0 1px 2px rgba(20,20,40,.06);
  --s2:0 6px 16px -4px rgba(20,20,40,.10);
  --s3:0 16px 32px -8px rgba(20,20,40,.16);

  /* floor accent colors — เหมือนปุ่มไฟลิฟต์แต่ละชั้น */
  --f-B:#6D5DF4; --f-1:#F0407A; --f-2:#F5A524; --f-3:#18B584; --f-4:#0EA5C4; --f-5:#8B5CF6; --f-6:#EF6FA5; --f-ALL:#12131A;
  /* พื้นหลังไล่สีสดใส ฟ้า-เขียว-ส้ม-แดง ให้ความรู้สึกสนุก มีชีวิตชีวา
     (การ์ด/แผงต่างๆ ยังคงพื้นผิวขาวทึบด้านบน จึงยังอ่านง่าย ไม่ตีกับพื้นหลัง) */
  --bg-gradient: linear-gradient(150deg,#0EA5E9 0%,#22C55E 32%,#F59E0B 66%,#EF4444 100%);
}
.dark{
  --bg:#0A0C14; --surface:#12141F; --surface2:#1A1D2C; --surface3:#232739;
  --border:#262A3C; --t1:#F2F3F8; --t2:#B7B9CC; --t3:#7C7F97; --t4:#4A4D63;
  --s1:0 1px 2px rgba(0,0,0,.3); --s2:0 6px 16px -4px rgba(0,0,0,.4); --s3:0 20px 40px -8px rgba(0,0,0,.55);
  --f-ALL:#F2F3F8;
  --bg-gradient: linear-gradient(150deg,#0C4A6E 0%,#14532D 32%,#78350F 66%,#7F1D1D 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--disp);color:var(--t1);min-height:100dvh;
  /* พื้นหลังไล่สีขยายใหญ่กว่าจอ + เลื่อนตำแหน่งช้าๆ ให้ความรู้สึกมีชีวิต ไม่นิ่งทื่อ
     (background-size ใหญ่กว่า 100% จึงเลื่อนได้โดยไม่เห็นขอบสีขาดตอน) */
  background:var(--bg-gradient);background-size:280% 280%;
  animation:bgFlow 22s ease infinite;
  -webkit-font-smoothing:antialiased;transition:background .35s var(--ease),color .35s var(--ease);
  padding-bottom:calc(6.5rem + env(safe-area-inset-bottom));
}
@keyframes bgFlow{0%{background-position:0% 30%}50%{background-position:100% 70%}100%{background-position:0% 30%}}
button,input,select{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;touch-action:manipulation}
/* ปุ่มทุกปุ่มตั้งเป็น containing block + ตัดขอบไว้ล่วงหน้า เพื่อให้เอฟเฟกต์ ripple (แตกวงคลื่นตอนแตะ)
   ที่แทรกด้วย JS มีขอบเขตชัดเจน ไม่ล้นออกนอกทรงปุ่ม */
button{position:relative;overflow:hidden}
.ripple-fx{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);
  transform:scale(0);animation:rippleFx .6s ease-out forwards;pointer-events:none}
@keyframes rippleFx{to{transform:scale(2.6);opacity:0}}
input[type=text],input[type=tel],select{font-size:16px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(120,120,150,.25);border-radius:99px}
:focus-visible{outline:2px solid var(--f-3);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ══════════ TOPBAR ══════════ */
.topbar{
  position:sticky;top:0;z-index:120;
  padding:1rem max(1rem,env(safe-area-inset-left)) 1rem max(1rem,env(safe-area-inset-right));
  background:color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  position:sticky;box-shadow:var(--s2);
}
/* แถบไล่สีแบรนด์ด้านล่าง Header — ให้ Header เด่นและจำได้ทันทีว่าเป็น SBK
   ใช้สีเดียวกับพื้นหลังไล่เฉดของทั้งแอป เพื่อผูกอัตลักษณ์เข้าด้วยกัน */
.topbar::after{
  content:'';position:absolute;left:0;right:0;bottom:-3px;height:3px;
  background:linear-gradient(90deg,#0EA5E9,#22C55E,#F59E0B,#EF4444);
}
.brand{display:flex;align-items:center;gap:.7rem;flex-shrink:0}
.brand-mark{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#6D5DF4,#0EA5C4 55%,#18B584);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;
  box-shadow:0 8px 20px -4px rgba(109,93,244,.6), inset 0 1px 0 rgba(255,255,255,.3);
}
.brand-txt{line-height:1.1}
.brand-txt b{font-size:1.2rem;font-weight:900;letter-spacing:-.03em;display:block}
.brand-txt span{font-size:.7rem;color:var(--t3);font-weight:600}
.top-search{flex:1;min-width:160px;max-width:440px;position:relative}
.top-search input{
  width:100%;height:42px;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:0 2.4rem 0 2.6rem;font-size:16px;color:var(--t1);
  transition:all .2s var(--ease);
}
.top-search input:focus{border-color:var(--f-3);box-shadow:0 0 0 4px color-mix(in srgb, var(--f-3) 15%, transparent);background:var(--surface)}
.top-search i.ico{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--t4);font-size:.85rem}
.top-search .clear{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t3);opacity:0;transition:opacity .15s}
.top-search .clear.show{opacity:1}
.top-search .clear:hover{background:var(--surface3)}
.top-actions{display:flex;gap:.4rem;margin-left:auto;flex-shrink:0;align-items:center}
.ic-btn{
  width:42px;height:42px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--border);color:var(--t2);font-size:.9rem;transition:all .2s var(--ease);
}
.ic-btn:hover{background:var(--surface3);color:var(--t1)}
.ic-btn:active{transform:scale(.9)}
.dark .ic-btn.theme i{color:#FBBF24}
/* ปุ่ม "เพิ่มร้านค้า" แบบมีข้อความ — วางไว้ใน Header ให้เห็นชัดเจนเสมอ
   แทนที่จะพึ่ง FAB ลอยอย่างเดียว (ผู้ใช้บอกว่าหาไม่เจอ) */
.btn-add-header{
  height:42px;padding:0 1rem;border-radius:var(--r-sm);display:flex;align-items:center;gap:.5rem;
  background:linear-gradient(135deg,#6D5DF4,#0EA5C4);color:#fff;font-weight:700;font-size:.85rem;
  box-shadow:0 6px 16px -4px rgba(109,93,244,.5);transition:transform .18s var(--sp);white-space:nowrap;
}
.btn-add-header:active{transform:scale(.94)}
@media(max-width:520px){.btn-add-header .txt{display:none}}

/* ══════════ ELEVATOR PANEL — signature element ══════════ */
.elev-wrap{padding:1rem max(1rem,env(safe-area-inset-left)) 0}
.elev-panel{
  background:linear-gradient(180deg,var(--surface),var(--surface2));
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:.9rem;box-shadow:var(--s1);position:relative;overflow:hidden;
}
.elev-label{display:flex;align-items:center;gap:.4rem;font-size:.68rem;font-weight:700;color:var(--t3);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.65rem;padding:0 .15rem}
.elev-label i{color:var(--t4)}
.elev-row{display:flex;gap:.5rem;overflow-x:auto;padding:.15rem;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.elev-row::-webkit-scrollbar{display:none}
.elev-btn{
  --fc:var(--f-ALL);
  flex-shrink:0;scroll-snap-align:start;min-width:88px;height:98px;border-radius:18px;
  /* พาสเทลไล่เฉด + เงาวาว: ใช้ color-mix กับ white/black ตรงๆ (ไม่พึ่ง var(--surface))
     เพื่อให้สีสดใสเหมือนกันทั้งโหมดมืด/สว่างตามที่ผู้ใช้ต้องการ ไม่ถูกทำให้หม่นในดาร์กโหมด */
  background:linear-gradient(135deg, color-mix(in srgb, var(--fc) 30%, white 70%) 0%, color-mix(in srgb, var(--fc) 10%, white 90%) 100%);
  border:1.5px solid color-mix(in srgb, var(--fc) 32%, transparent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;
  transition:transform .18s var(--sp),background .25s var(--ease),border-color .25s,box-shadow .25s;
  position:relative;overflow:hidden;
  box-shadow:0 4px 12px -4px color-mix(in srgb, var(--fc) 35%, transparent);
}
/* เงาวาว (glossy sheen) — แถบแสงทแยงมุมลอยอยู่บนพื้นสี ให้ความรู้สึกเงาเหมือนการ์ดพรีเมียม */
.elev-btn::before{
  content:'';position:absolute;top:-70%;left:-25%;width:65%;height:220%;
  background:linear-gradient(120deg, rgba(255,255,255,.75), rgba(255,255,255,0) 65%);
  transform:rotate(14deg);pointer-events:none;
}
.elev-btn .fl{font-family:var(--mono);font-weight:800;font-size:2.05rem;transition:color .25s;line-height:1;
  color:color-mix(in srgb, var(--fc) 82%, black 20%);position:relative}
.elev-btn .ct{font-size:.92rem;font-weight:700;transition:color .25s;position:relative;
  color:color-mix(in srgb, var(--fc) 70%, black 12%)}
.elev-btn::after{
  content:'';position:absolute;inset:0;border-radius:18px;opacity:0;
  background:radial-gradient(circle at 50% 30%, var(--fc), transparent 70%);
  transition:opacity .3s var(--ease);
}
.elev-btn:active{transform:scale(.92)}
.elev-btn.on{
  background:var(--fc);border-color:var(--fc);
  box-shadow:0 6px 18px -4px color-mix(in srgb, var(--fc) 65%, transparent), inset 0 1px 0 rgba(255,255,255,.25);
  animation:elevDing .45s var(--sp);
}
.elev-btn.on .fl,.elev-btn.on .ct{color:#fff}
.elev-btn.on::after{opacity:.25}

/* ปุ่ม "ทุกชั้น" (ไอคอนร้านค้า) — ทำเป็นการ์ดสรุปกว้างกว่าปุ่มชั้นอื่น เพราะเป็นตัวเลขภาพรวม
   ที่สำคัญที่สุด (รวมยอดร้านค้าทั้งหมด) ต่างจากปุ่มชั้นเดี่ยวๆ ที่ควรมีขนาดเท่ากันหมด
   จึงให้สีสันติดตัวถาวร ไม่ต้องรอกดถึงจะเห็นสี */
.elev-btn.all-btn{
  min-width:190px;height:98px;flex-direction:row;justify-content:space-between;padding:0 1.2rem;
  background:linear-gradient(135deg,#0EA5C4,#18B584);border:none;box-shadow:0 6px 18px -4px rgba(14,165,196,.45);
}
.elev-btn.all-btn .fl{color:#fff;font-size:2.3rem}
.elev-btn.all-btn .ct{color:rgba(255,255,255,.92);font-size:.88rem;text-align:right}
.elev-btn.all-btn .ct b{display:block;font-family:var(--mono);font-size:1.6rem;color:#fff;line-height:1.1}
.elev-btn.all-btn.on{box-shadow:0 0 0 3px #fff, 0 6px 18px -4px rgba(14,165,196,.6)}
.elev-btn.all-btn::after{display:none}
@keyframes elevDing{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ══════════ GRID / CARDS ══════════ */
.grid-head{display:flex;align-items:center;justify-content:space-between;padding:.4rem max(1rem,env(safe-area-inset-left)) .5rem}
.grid-head h2{font-size:1rem;font-weight:700}
.gh-right{display:flex;align-items:center;gap:.6rem}
.grid-head span{font-size:.78rem;color:var(--t3)}
/* สวิตช์สลับมุมมอง Grid/Table — ใช้ปุ่มคู่แบบ segmented control ให้เห็นสถานะปัจจุบันชัดเจน */
.view-switch{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px}
.vs-btn{width:30px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:.8rem;transition:all .18s var(--ease)}
.vs-btn.on{background:linear-gradient(135deg,#6D5DF4,#0EA5C4);color:#fff;box-shadow:0 2px 8px -2px rgba(109,93,244,.5)}
.vs-btn:not(.on):hover{color:var(--t1);background:var(--surface3)}

/* ══════════ TABLE VIEW ══════════
   โหมดตาราง เหมาะกับการไล่ดูข้อมูลจำนวนมากทีเดียว/เทียบเบอร์โทรหลายร้าน
   ต่างจาก Grid ที่เน้นดูทีละร้านสวยๆ — ให้ผู้ใช้เลือกตามงานที่ทำ */
#listContainer.table-mode{
  display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--s1);
}
.sbk-table{width:100%;border-collapse:collapse;min-width:680px}
.sbk-table thead th{
  position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;font-size:.7rem;color:var(--t3);
  text-transform:uppercase;letter-spacing:.05em;padding:.7rem .85rem;border-bottom:1px solid var(--border);white-space:nowrap;
}
.sbk-table tbody td{padding:.6rem .85rem;font-size:.85rem;border-bottom:1px solid var(--border);color:var(--t1);vertical-align:middle}
.sbk-table tbody tr:last-child td{border-bottom:none}
.sbk-table tbody tr{transition:background .15s}
.sbk-table tbody tr:hover{background:var(--surface2)}
.tbl-room{font-family:var(--mono);font-weight:700;color:#fff;background:var(--fc);padding:.2rem .55rem;
  border-radius:7px;display:inline-flex;white-space:nowrap;font-size:.74rem}
.tbl-floor{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;color:color-mix(in srgb, var(--fc) 78%, black 20%)}
.tbl-floor i{width:8px;height:8px;border-radius:50%;background:var(--fc);display:inline-block}
.tbl-name{font-weight:700}
.tbl-en{color:var(--t3);font-size:.78rem}
.tbl-tel a{color:var(--t2);text-decoration:none}
.tbl-tel a:hover{color:var(--f-3);text-decoration:underline}
.tbl-actions{display:flex;gap:.3rem}
.tbl-actions button{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--t3);background:var(--surface2);font-size:.72rem;transition:all .15s}
.tbl-actions button:hover{background:var(--surface3);color:var(--t1)}
.tbl-actions .del:hover{color:#EF4444;background:#FEE2E2}
.dark .tbl-actions .del:hover{background:rgba(239,68,68,.15)}

.grid{
  padding:0 max(1rem,env(safe-area-inset-left)) 1rem;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.75rem;
}
/* จอแคบมากแบบ iPhone SE (320px) / Android จอเล็ก: บังคับคอลัมน์เดียว
   กัน minmax ดันการ์ดล้นแนวนอนจนต้องเลื่อนซ้าย-ขวา ซึ่งใช้งานจริงบนมือถือไม่ได้ */
@media(max-width:380px){
  .grid{grid-template-columns:1fr}
}
.shop-card{
  /* พาสเทลไล่เฉด + เงาวาว แบบเดียวกับปุ่มชั้น เพื่อให้ภาพรวมทั้งแอปเป็นภาษาดีไซน์เดียวกัน
     ใช้ color-mix กับ white ตรงๆ ไม่พึ่ง var(--surface) จึงสีสดใสเท่ากันทั้งโหมดมืด/สว่าง */
  background:linear-gradient(135deg, color-mix(in srgb, var(--fc) 16%, white 84%) 0%, color-mix(in srgb, var(--fc) 5%, white 95%) 100%);
  border:1px solid color-mix(in srgb, var(--fc) 28%, transparent);border-radius:var(--r-md);
  padding:.9rem 1rem;position:relative;overflow:hidden;
  box-shadow:0 4px 12px -4px color-mix(in srgb, var(--fc) 30%, transparent);
  opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease),transform .4s var(--ease),box-shadow .2s;
}
.shop-card.visible{opacity:1;transform:none}
.shop-card:hover{box-shadow:0 14px 28px -8px color-mix(in srgb, var(--fc) 50%, transparent);transform:translateY(-3px) scale(1.012)}
.shop-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fc)}
/* เงาวาวทแยงมุมบนการ์ด */
.shop-card::after{
  content:'';position:absolute;top:-80%;left:-30%;width:55%;height:240%;
  background:linear-gradient(120deg, rgba(255,255,255,.5), rgba(255,255,255,0) 65%);
  transform:rotate(12deg);pointer-events:none;
}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin-bottom:.4rem;padding-left:.35rem;position:relative}
.sc-room{font-family:var(--mono);font-size:.78rem;font-weight:700;color:#fff;background:var(--fc);
  padding:.15rem .5rem;border-radius:7px;display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.sc-actions{display:flex;gap:.3rem;flex-shrink:0}
.sc-actions button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:color-mix(in srgb, var(--fc) 60%, black 15%);background:color-mix(in srgb, var(--fc) 14%, white 86%);font-size:.72rem;transition:all .15s}
.sc-actions button:hover{background:color-mix(in srgb, var(--fc) 28%, white 72%);color:color-mix(in srgb, var(--fc) 80%, black 25%)}
.sc-actions .del:hover{color:#EF4444;background:#FEE2E2}
.dark .sc-actions .del:hover{background:rgba(239,68,68,.15)}
.sc-name{padding-left:.35rem;font-weight:800;font-size:1.05rem;line-height:1.3;position:relative;
  color:color-mix(in srgb, var(--fc) 82%, black 28%)}
.sc-en{padding-left:.35rem;font-size:.82rem;margin-top:.05rem;position:relative;
  color:color-mix(in srgb, var(--fc) 62%, black 12%);opacity:.85}
.sc-meta{padding-left:.35rem;margin-top:.5rem;display:flex;flex-direction:column;gap:.3rem;position:relative}
.sc-meta a,.sc-meta .zn{display:flex;align-items:center;gap:.4rem;font-size:.82rem;text-decoration:none;
  color:color-mix(in srgb, var(--fc) 66%, black 18%)}
.sc-meta a i,.sc-meta .zn i{width:14px;color:color-mix(in srgb, var(--fc) 70%, black 10%);font-size:.75rem}
.sc-meta a:hover{color:color-mix(in srgb, var(--fc) 90%, black 10%);text-decoration:underline}

.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--t3)}
.empty .ic{font-size:2.4rem;margin-bottom:.6rem;display:block}
.empty h3{color:var(--t1);font-size:1.05rem;margin-bottom:.3rem}
.empty button{margin-top:1rem;padding:.55rem 1.1rem;border-radius:var(--r-sm);background:var(--t1);color:var(--surface);font-weight:600;font-size:.82rem;display:inline-flex;gap:.4rem;align-items:center}

/* ══════════ FAB ══════════ */
.fab{
  position:fixed;right:max(1.1rem,env(safe-area-inset-right));bottom:calc(1.3rem + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;z-index:150;
  background:linear-gradient(150deg,#6D5DF4,#0EA5C4);color:#fff;font-size:1.3rem;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgba(109,93,244,.55);
  transition:transform .25s var(--sp);
  animation:fabPulse 2.8s ease-in-out infinite;
}
/* จังหวะเรืองแสงเบาๆ รอบปุ่มเพิ่มร้าน ให้สายตาสังเกตเห็นได้ง่ายตอนไล่ดูรายการยาวๆ
   โดยไม่แรงเกินจนรำคาญ (ขยาย/หด box-shadow เท่านั้น ไม่ขยับตำแหน่งปุ่ม) */
@keyframes fabPulse{0%,100%{box-shadow:0 10px 24px -6px rgba(109,93,244,.55)}50%{box-shadow:0 10px 30px -2px rgba(109,93,244,.85),0 0 0 6px rgba(109,93,244,.12)}}
.fab:active{transform:scale(.9);animation-play-state:paused}
.fab i{transition:transform .3s var(--ease)}
.fab.rot i{transform:rotate(135deg)}

/* ══════════ DRAWER (Add/Edit) ══════════ */
.drawer-bg{position:fixed;inset:0;background:rgba(10,12,20,.55);backdrop-filter:blur(2px);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.drawer-bg.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:201;background:var(--surface);
  border-radius:24px 24px 0 0;max-height:88dvh;overflow-y:auto;
  padding:1.1rem 1.1rem calc(1.5rem + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .35s var(--sp);box-shadow:0 -20px 50px -10px rgba(0,0,0,.3);
}
.drawer.show{transform:translateY(0)}
@media(min-width:720px){
  .drawer{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-46%) scale(.96);
    width:min(520px,92vw);border-radius:24px;opacity:0;pointer-events:none;max-height:86dvh}
  .drawer.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
}
.drawer-handle{width:40px;height:5px;background:var(--surface3);border-radius:99px;margin:0 auto .9rem}
@media(min-width:720px){.drawer-handle{display:none}}
.drawer-head{display:flex;align-items:center;gap:.7rem;margin-bottom:1.1rem}
.drawer-head .di{width:42px;height:42px;border-radius:12px;background:linear-gradient(150deg,#6D5DF4,#0EA5C4);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
.drawer-head h3{font-size:1.05rem;font-weight:700}
.drawer-head p{font-size:.78rem;color:var(--t3)}
.drawer-head .x{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--t3)}
.f-group{margin-bottom:.85rem}
.f-group label{display:block;font-size:.78rem;font-weight:600;color:var(--t2);margin-bottom:.35rem}
.f-group label .req{color:#F0407A}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.f-input,.f-select{
  width:100%;height:44px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface2);
  padding:0 .8rem;font-size:16px;color:var(--t1);transition:all .2s var(--ease);
}
.f-input:focus,.f-select:focus{border-color:var(--f-3);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb, var(--f-3) 14%, transparent)}
.drawer-foot{display:flex;gap:.6rem;margin-top:1.2rem}
.btn{height:46px;border-radius:var(--r-sm);font-weight:700;font-size:.88rem;display:flex;align-items:center;justify-content:center;gap:.5rem;transition:all .2s var(--ease);flex:1}
.btn-primary{background:linear-gradient(135deg,#6D5DF4,#0EA5C4);color:#fff;box-shadow:0 8px 18px -6px rgba(109,93,244,.5)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--surface2);color:var(--t2);flex:0 0 auto;padding:0 1.1rem}

/* ══════════ EXPORT MENU ══════════ */
.exp-wrap{position:relative}
.exp-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);box-shadow:var(--s3);min-width:210px;padding:.4rem;z-index:210;
  opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:all .18s var(--ease)}
.exp-menu.open{opacity:1;transform:none;pointer-events:auto}
.exp-item{width:100%;display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:10px;font-size:.85rem;font-weight:600;color:var(--t2);text-align:left}
.exp-item:hover{background:var(--surface2);color:var(--t1)}
.exp-item i{width:16px;color:var(--t4)}

/* ══════════ TOAST ══════════ */
#toast{
  position:fixed;left:50%;bottom:calc(5.7rem + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--t1);color:var(--bg);padding:.7rem 1.1rem;border-radius:99px;font-size:.82rem;font-weight:600;
  display:flex;align-items:center;gap:.5rem;z-index:300;opacity:0;pointer-events:none;transition:all .3s var(--sp);
  box-shadow:0 12px 24px -6px rgba(0,0,0,.3);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast.error{background:#EF4444;color:#fff}
#toast.info{background:#0EA5C4;color:#fff}

/* ══════════ SKELETON (loading state) ══════════ */
.skel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);height:118px;position:relative;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb, var(--t3) 20%, transparent),transparent);
  animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

@media(min-width:720px){
  .top-actions .lbl-txt{display:inline}
}
.hide{display:none!important}

/* ══════════ MOBILE COMPACT LAYOUT (Android / iOS) ══════════
   บนจอมือถือ พื้นที่จำกัดกว่าเดสก์ท็อปมาก การ์ด/แผงลิฟต์ขนาดเท่าเดสก์ท็อป
   จะกินพื้นที่ scroll โดยไม่จำเป็น จึงลด padding/ขนาดตัวอักษร/ความสูงปุ่ม
   ลงเฉพาะช่วงนี้ ให้เห็นร้านค้าได้มากขึ้นต่อการเลื่อน 1 ครั้ง โดยยังคง
   touch target ไม่ต่ำกว่ามาตรฐาน (~40px ขึ้นไป) */
@media(max-width:480px){
  .topbar{padding:.65rem .85rem;gap:.5rem}
  .brand-mark{width:38px;height:38px;border-radius:11px;font-size:1rem}
  .brand-txt b{font-size:1rem}
  .brand-txt span{font-size:.62rem}
  .btn-add-header{height:38px;padding:0 .8rem;font-size:.8rem}
  .ic-btn{width:38px;height:38px}
  .top-search input{height:40px}
  /* ย้ายช่องค้นหาลงมาเป็นแถวเต็มความกว้างของตัวเอง แทนที่จะแย่งพื้นที่กับโลโก้/ปุ่ม
     บนแถวเดียวกันจนถูกบีบแคบจนอ่านคำ placeholder ไม่ครบ (ตามที่ผู้ใช้ชี้ในภาพ) */
  .brand{order:1}
  .top-actions{order:2;margin-left:auto}
  .top-search{order:3;flex:1 1 100%;max-width:none;margin-top:.15rem}

  .elev-wrap{padding:.65rem .85rem 0}
  .elev-panel{padding:.65rem}
  .elev-label{font-size:.64rem;margin-bottom:.5rem}
  .elev-btn{min-width:72px;height:76px;border-radius:14px;gap:.15rem}
  .elev-btn .fl{font-size:1.5rem}
  .elev-btn .ct{font-size:.66rem}
  .elev-btn.all-btn{min-width:150px;height:76px;padding:0 .85rem}
  .elev-btn.all-btn .fl{font-size:1.7rem}
  .elev-btn.all-btn .ct{font-size:.68rem}
  .elev-btn.all-btn .ct b{font-size:1.15rem}

  .grid-head{padding:.3rem .85rem .4rem}
  .grid-head h2{font-size:.9rem}
  .vs-btn{width:26px;height:24px;font-size:.7rem}
  .sbk-table{min-width:580px}
  .grid{padding:0 .85rem .85rem;gap:.55rem}
  .shop-card{padding:.7rem .8rem}
  .sc-name{font-size:.92rem}
  .sc-en,.sc-meta a,.sc-meta .zn{font-size:.74rem}
  .sc-room{font-size:.68rem}
  .sc-actions button{width:30px;height:30px}

  .fab{width:52px;height:52px;font-size:1.15rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom))}
  body{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}
}


/* ══════════ SPLASH / INTRO ══════════
   หน้าเปิดตัวสั้นๆ ก่อนเข้าแดชบอร์ด ใช้โทนเดียวกับพื้นหลังไล่สีของทั้งแอป
   (ฟ้า-เขียว-ส้ม-แดง) เพื่อให้แบรนด์ต่อเนื่องกันตั้งแต่วินาทีแรกที่เปิด */
#splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  background:linear-gradient(150deg,#0EA5E9 0%,#22C55E 35%,#F59E0B 68%,#EF4444 100%);
  transition:opacity .5s var(--ease),visibility .5s;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.sp-mark{
  width:96px;height:96px;border-radius:26px;position:relative;overflow:hidden;
  background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.6rem;
  animation:spPop .7s var(--sp) both, spGlow 2.2s ease .7s infinite;
}
@keyframes spPop{0%{transform:scale(0) rotate(-15deg);opacity:0}60%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.sp-title{margin-top:1.4rem;font-size:1.9rem;font-weight:900;color:#fff;letter-spacing:-.03em;
  animation:spSlide .6s var(--sp) .25s both;text-shadow:0 4px 16px rgba(0,0,0,.15)}
.sp-title em{font-style:normal;opacity:.92}
.sp-sub{font-size:.85rem;color:rgba(255,255,255,.85);font-weight:600;margin-top:.3rem;animation:spSlide .6s ease .4s both}
@keyframes spSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sp-bar{width:150px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:1.8rem;overflow:hidden;animation:spSlide .5s ease .5s both}
.sp-fill{height:100%;border-radius:99px;background:#fff;width:0%;animation:spFill 1.7s var(--ease) .55s forwards}
@keyframes spFill{to{width:100%}}
@media(prefers-reduced-motion:reduce){#splash{display:none}}

</style>
</head>
<body>

<!-- ══════════ SPLASH / INTRO — แสดง ~2 วินาทีก่อนเข้าแดชบอร์ด ══════════ -->
<div id="splash" aria-hidden="true">
  <div class="sp-mark"><i class="fas fa-building-columns"></i></div>
  <div class="sp-title">SBK <em>Directory</em></div>
  <div class="sp-sub">ทำเนียบร้านค้า Seacon Bangkae</div>
  <div class="sp-bar"><div class="sp-fill"></div></div>
</div>

<!-- ══════════ TOPBAR ══════════ -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark"><i class="fas fa-building-columns"></i></div>
    <div class="brand-txt"><b>SBK <span style="color:var(--f-3)">Directory</span></b><span id="totalCountLbl">— รายชื่อร้านค้า</span></div>
  </div>
  <div class="top-search">
    <i class="fas fa-magnifying-glass ico"></i>
    <input id="searchInput" type="text" placeholder="ค้นหาร้านค้า, เลขห้อง, เบอร์โทร..." autocomplete="off">
    <button class="clear" id="clearBtn" onclick="clearSearch()"><i class="fas fa-circle-xmark"></i></button>
  </div>
  <div class="top-actions">
    <button class="btn-add-header" onclick="openDrawer(-1)"><i class="fas fa-plus"></i><span class="txt">เพิ่มร้าน</span></button>
    <button class="ic-btn theme" id="themeBtn" onclick="toggleDark()" aria-label="สลับธีมมืด/สว่าง"><i class="fas fa-moon" id="themeIcon"></i></button>
    <div class="exp-wrap">
      <button class="ic-btn" onclick="toggleExpMenu(event)" aria-label="นำเข้า/ส่งออกข้อมูล"><i class="fas fa-arrow-up-from-bracket"></i></button>
      <div class="exp-menu" id="expMenu">
        <button class="exp-item" onclick="exportExcel()"><i class="fas fa-file-excel"></i> ส่งออก Excel</button>
        <button class="exp-item" onclick="exportJSON()"><i class="fas fa-file-code"></i> ส่งออก JSON</button>
        <button class="exp-item" onclick="triggerImport()"><i class="fas fa-file-import"></i> นำเข้า JSON</button>
        <button class="exp-item" onclick="resetToDefault()"><i class="fas fa-rotate-left"></i> รีเซ็ตข้อมูลต้นฉบับ</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json" class="hide" onchange="importJSON(event)">
  </div>
</div>

<!-- ══════════ ELEVATOR PANEL (signature) ══════════ -->
<div class="elev-wrap">
  <div class="elev-panel">
    <div class="elev-label"><i class="fas fa-layer-group"></i> เลือกชั้น — เหมือนปุ่มกดลิฟต์จริง</div>
    <div class="elev-row" id="elevRow"></div>
  </div>
</div>

<!-- ══════════ GRID ══════════ -->
<div class="grid-head">
  <h2 id="resultLabel">ร้านค้าทั้งหมด</h2>
  <div class="gh-right">
    <span id="resultCount">0 รายการ</span>
    <div class="view-switch" role="group" aria-label="สลับมุมมองรายการ">
      <button class="vs-btn on" id="viewGridBtn" onclick="setView('grid')" aria-label="มุมมองการ์ด" title="มุมมองการ์ด"><i class="fas fa-table-cells-large"></i></button>
      <button class="vs-btn" id="viewTableBtn" onclick="setView('table')" aria-label="มุมมองตาราง" title="มุมมองตาราง"><i class="fas fa-table-list"></i></button>
    </div>
  </div>
</div>
<div class="grid" id="listContainer">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
</div>

<!-- ══════════ FAB ══════════ -->
<button class="fab" id="fab" onclick="openDrawer(-1)" aria-label="เพิ่มร้านค้าใหม่"><i class="fas fa-plus"></i></button>

<!-- ══════════ DRAWER: ADD / EDIT ══════════ -->
<div class="drawer-bg" id="drawerBg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="drawer-handle"></div>
  <div class="drawer-head">
    <div class="di" id="drawerIcon"><i class="fas fa-store"></i></div>
    <div><h3 id="drawerTitle">เพิ่มร้านค้าใหม่</h3><p id="drawerSub">กรอกข้อมูลร้านค้าให้ครบถ้วน</p></div>
    <button class="x" onclick="closeDrawer()"><i class="fas fa-xmark"></i></button>
  </div>
  <input type="hidden" id="editIndex" value="-1">
  <div class="f-row">
    <div class="f-group"><label>เลขห้อง <span class="req">*</span></label><input class="f-input mono" id="f-room" placeholder="เช่น 402A"></div>
    <div class="f-group"><label>ชั้น <span class="req">*</span></label>
      <select class="f-select" id="f-floor">
        <option value="B">ชั้น B</option><option value="1">ชั้น 1</option><option value="2">ชั้น 2</option>
        <option value="3">ชั้น 3</option><option value="4">ชั้น 4</option><option value="5">ชั้น 5</option><option value="6">ชั้น 6</option>
      </select>
    </div>
  </div>
  <div class="f-group"><label>ชื่อร้าน (ไทย) <span class="req">*</span></label><input class="f-input" id="f-nameTh" placeholder="เช่น สุกี้นางพญา"></div>
  <div class="f-group"><label>ชื่อร้าน (อังกฤษ)</label><input class="f-input" id="f-nameEn" placeholder="เช่น Suki Nangphaya"></div>
  <div class="f-group"><label>เบอร์ติดต่อ</label><input class="f-input" id="f-tel" placeholder="เช่น 02-458-2509" type="tel"></div>
  <div class="f-group"><label>บริเวณ / โซน</label><input class="f-input" id="f-zone" placeholder="เช่น บริเวณลานกลาง"></div>
  <div class="drawer-foot">
    <button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
    <button class="btn btn-primary" id="saveBtn" onclick="saveShop()"><i class="fas fa-check"></i> บันทึกข้อมูล</button>
  </div>
</div>

   FLOOR CONFIG — สีประจำชั้น (ตรงกับปุ่มลิฟต์ใน CSS token --f-*)
   ทำไมแยกเป็น object นี้: ใช้ map สีเดียวกันได้ทั้ง badge, การ์ด,
   แถบสถิติ และปุ่มลิฟต์ ไม่ต้องเขียนสีซ้ำหลายที่
══════════════════════════════════════════════════════════ */
const FLOORS = ['ALL','B','1','2','3','4','5','6'];
const FLOOR_NAME = {ALL:'ทุกชั้น',B:'ชั้น B',1:'ชั้น 1',2:'ชั้น 2',3:'ชั้น 3',4:'ชั้น 4',5:'ชั้น 5',6:'ชั้น 6'};
const FLOOR_COLOR = {ALL:'var(--f-ALL)',B:'var(--f-B)',1:'var(--f-1)',2:'var(--f-2)',3:'var(--f-3)',4:'var(--f-4)',5:'var(--f-5)',6:'var(--f-6)'};

/* ── STATE ──
   ข้อมูลเก็บใน localStorage เพื่อให้แก้ไขแล้วอยู่ถาวรในเครื่อง
   ถ้ายังไม่เคยแก้ไข ใช้ DEFAULT_SHOPS (ข้อมูลต้นฉบับ 422 ร้าน) */
let shops = [];
try{
  const saved = localStorage.getItem('sbk_dir_v2');
  shops = saved ? JSON.parse(saved) : DEFAULT_SHOPS.map(s=>({...s}));
}catch(e){ shops = DEFAULT_SHOPS.map(s=>({...s})); }

let currentFloor = 'ALL';
let currentSearch = '';
let searchDebounce = null;
/* จำโหมดมุมมองที่เลือกไว้ใน localStorage เพื่อไม่ต้องเลือกใหม่ทุกครั้งที่เปิดแอป */
let currentView = localStorage.getItem('sbk_view') || 'grid';

function setView(v){
  if(v===currentView) return;
  currentView = v;
  try{ localStorage.setItem('sbk_view', v); }catch(e){}
  document.getElementById('viewGridBtn').classList.toggle('on', v==='grid');
  document.getElementById('viewTableBtn').classList.toggle('on', v==='table');
  haptic(8);
  render();
}

function persist(){
  try{ localStorage.setItem('sbk_dir_v2', JSON.stringify(shops)); }
  catch(e){ toast('บันทึกลง localStorage ไม่สำเร็จ (พื้นที่เต็ม?)','error'); }
}

/* ══════════ ELEVATOR PANEL BUILD ══════════
   สร้างปุ่มลิฟต์ครั้งเดียวตอนโหลด แล้วอัปเดตแค่ตัวเลข/สถานะ on ใน render()
   เพื่อไม่ต้องสร้าง DOM ใหม่ทุกครั้งที่พิมพ์ค้นหา (ลด layout thrash) */
function buildElevator(){
  const row = document.getElementById('elevRow');
  row.innerHTML = FLOORS.map(f=>{
    if(f==='ALL'){
      /* ปุ่ม ALL รวมบทบาทของการ์ด "ร้านค้าทั้งหมด" เดิมไว้ในตัว จึงมีเลย์เอาต์
         แนวนอน กว้างกว่า และมีสีถาวร ต่างจากปุ่มชั้นเดี่ยวที่ต้องขนาดเท่ากันหมด */
      return `
      <button class="elev-btn all-btn${f===currentFloor?' on':''}" id="elev-${f}"
        onclick="setFloor('${f}')" aria-pressed="${f===currentFloor}">
        <span class="fl"><i class="fas fa-shop"></i></span>
        <span class="ct">ร้านค้าทั้งหมด<b id="elev-ct-${f}">0</b></span>
      </button>`;
    }
    return `
    <button class="elev-btn${f===currentFloor?' on':''}" id="elev-${f}" style="--fc:${FLOOR_COLOR[f]}"
      onclick="setFloor('${f}')" aria-pressed="${f===currentFloor}">
      <span class="fl">${f}</span>
      <span class="ct" id="elev-ct-${f}">0 ร้าน</span>
    </button>`;
  }).join('');
}

function setFloor(f){
  currentFloor = f;
  haptic(8);
  render();
}

/* ══════════ RENDER ══════════
   จุดศูนย์กลางของแอป: กรอง → เรียง → วาดการ์ด → อัปเดตสถิติ/ปุ่มลิฟต์
   เรียกทุกครั้งที่ค้นหา/เปลี่ยนชั้น/แก้ไขข้อมูลเสร็จ */
function render(){
  const kw = currentSearch.toLowerCase().trim();
  const list = shops.filter(s=>{
    const mf = currentFloor==='ALL' || s.floor===currentFloor;
    const mk = !kw || [s.nameTh,s.room,s.nameEn||'',s.zone||'',s.tel||''].some(v=>v.toLowerCase().includes(kw));
    return mf && mk;
  }).sort((a,b)=> a.floor.localeCompare(b.floor) || a.room.localeCompare(b.room));

  renderElevatorCounts();
  renderList(list);

  document.getElementById('resultCount').textContent = `${list.length} รายการ`;
  document.getElementById('resultLabel').textContent = kw
    ? `ผลค้นหา "${currentSearch}"`
    : (currentFloor==='ALL' ? 'ร้านค้าทั้งหมด' : FLOOR_NAME[currentFloor]);
  document.getElementById('totalCountLbl').textContent = `— ${shops.length} ร้านค้าทั้งหมด`;
}

function renderElevatorCounts(){
  FLOORS.forEach(f=>{
    const cnt = f==='ALL' ? shops.length : shops.filter(s=>s.floor===f).length;
    const el = document.getElementById('elev-ct-'+f);
    if(el) animateCount(el, cnt, f==='ALL' ? '' : ' ร้าน');
    const btn = document.getElementById('elev-'+f);
    if(btn) btn.classList.toggle('on', f===currentFloor);
  });
}

/* ── นับตัวเลขไล่ขึ้น/ลง แทนการเปลี่ยนค่าทันที ──
   ทำให้เห็นการเปลี่ยนแปลงชัดเจนขึ้นเวลาสลับชั้น/ค้นหา (สายตาจับการเปลี่ยนแปลงได้ง่ายกว่า
   ตัวเลขที่กระโดดเปลี่ยนดื้อๆ) ใช้ requestAnimationFrame + easing แทน setInterval
   เพื่อให้ลื่นและเบา CPU กว่า */
const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
function animateCount(el, target, suffix=''){
  const start = parseInt(el.getAttribute('data-n')||'0', 10);
  el.setAttribute('data-n', target);
  if(reduceMotionQuery.matches || start===target){ el.textContent = target+suffix; return; }
  const dur = 420, t0 = performance.now();
  function step(now){
    const p = Math.min((now-t0)/dur, 1);
    const eased = 1-Math.pow(1-p, 3); // ease-out cubic
    el.textContent = Math.round(start+(target-start)*eased)+suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderList(list){
  const box = document.getElementById('listContainer');
  box.classList.toggle('table-mode', currentView==='table');
  box.classList.toggle('grid', currentView==='grid');

  if(!list.length){
    box.innerHTML = `<div class="empty">
      <span class="ic">🔍</span><h3>ไม่พบร้านค้าที่ค้นหา</h3>
      <p>ลองเปลี่ยนคำค้นหา หรือเลือกชั้นอื่น</p>
      <button onclick="clearSearch();setFloor('ALL')"><i class="fas fa-rotate-right"></i> แสดงทั้งหมด</button>
    </div>`;
    return;
  }
  if(currentView==='table') renderTableView(list, box);
  else renderGridView(list, box);
}

function renderGridView(list, box){
  box.innerHTML = list.map(s=>{
    const ri = shops.indexOf(s);
    const fc = FLOOR_COLOR[s.floor] || FLOOR_COLOR.ALL;
    const tel = (s.tel||'').trim().split('\n')[0];
    return `
    <div class="shop-card" style="--fc:${fc}">
      <div class="sc-top">
        <span class="sc-room mono" style="--fc:${fc}"><i class="fas fa-door-open"></i>${escapeHtml(s.room)}</span>
        <div class="sc-actions">
          <button onclick="openDrawer(${ri})" aria-label="แก้ไข"><i class="fas fa-pen"></i></button>
          <button class="del" onclick="deleteShop(${ri})" aria-label="ลบ"><i class="fas fa-trash"></i></button>
        </div>
      </div>
      <div class="sc-name">${escapeHtml(s.nameTh)}</div>
      ${s.nameEn ? `<div class="sc-en">${escapeHtml(s.nameEn)}</div>` : ''}
      <div class="sc-meta">
        ${tel ? `<a href="tel:${tel.replace(/[^0-9+]/g,'')}"><i class="fas fa-phone"></i>${escapeHtml(tel)}</a>` : ''}
        ${s.zone ? `<span class="zn"><i class="fas fa-location-dot"></i>${escapeHtml(s.zone)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  initCardObserver();
}

/* โหมดตาราง — เหมาะกับการไล่ดู/เทียบข้อมูลจำนวนมากรวดเดียว ต่างจาก Grid ที่เน้นดูทีละร้าน
   ใช้ <table> จริงเพื่อให้เลื่อนแนวนอนบนมือถือลื่นและหัวตารางติดด้านบน (sticky) ได้ */
function renderTableView(list, box){
  const rows = list.map(s=>{
    const ri = shops.indexOf(s);
    const fc = FLOOR_COLOR[s.floor] || FLOOR_COLOR.ALL;
    const tel = (s.tel||'').trim().split('\n')[0];
    return `
    <tr style="--fc:${fc}">
      <td><span class="tbl-room">${escapeHtml(s.room)}</span></td>
      <td><span class="tbl-floor"><i></i>${FLOOR_NAME[s.floor]||s.floor}</span></td>
      <td><div class="tbl-name">${escapeHtml(s.nameTh)}</div>${s.nameEn?`<div class="tbl-en">${escapeHtml(s.nameEn)}</div>`:''}</td>
      <td class="tbl-tel">${tel?`<a href="tel:${tel.replace(/[^0-9+]/g,'')}"><i class="fas fa-phone"></i> ${escapeHtml(tel)}</a>`:'-'}</td>
      <td>${s.zone?escapeHtml(s.zone):'-'}</td>
      <td>
        <div class="tbl-actions">
          <button onclick="openDrawer(${ri})" aria-label="แก้ไข"><i class="fas fa-pen"></i></button>
          <button class="del" onclick="deleteShop(${ri})" aria-label="ลบ"><i class="fas fa-trash"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');
  box.innerHTML = `
    <table class="sbk-table">
      <thead><tr>
        <th>ห้อง</th><th>ชั้น</th><th>ชื่อร้าน</th><th>เบอร์โทร</th><th>โซน</th><th>จัดการ</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ── การ์ดค่อยๆ ปรากฏเมื่อเลื่อนเข้ามาในจอ (ให้ความรู้สึกลื่นไหล ไม่กระตุก) ── */
let _cardObserver = null;
function initCardObserver(){
  if(_cardObserver) _cardObserver.disconnect();
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('.shop-card').forEach(c=>c.classList.add('visible'));
    return;
  }
  _cardObserver = new IntersectionObserver(entries=>{
    entries.forEach((entry,i)=>{
      if(entry.isIntersecting){
        entry.target.style.transitionDelay = Math.min(i*.03,.25)+'s';
        entry.target.classList.add('visible');
        _cardObserver.unobserve(entry.target);
      }
    });
  },{threshold:.06, rootMargin:'0px 0px -20px 0px'});
  document.querySelectorAll('.shop-card').forEach(c=>_cardObserver.observe(c));
}

/* ══════════ SEARCH ══════════
   Debounce 220ms กันเรียก render() ถี่เกินไปตอนพิมพ์เร็ว */
function onSearchInput(v){
  document.getElementById('clearBtn').classList.toggle('show', v.length>0);
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{ currentSearch = v; render(); }, 220);
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('clearBtn').classList.remove('show');
  currentSearch=''; render();
}

/* ══════════ CRUD ══════════ */
function openDrawer(index){
  const isEdit = index > -1;
  document.getElementById('editIndex').value = index;
  if(isEdit){
    const s = shops[index];
    document.getElementById('f-room').value = s.room;
    document.getElementById('f-floor').value = s.floor;
    document.getElementById('f-nameTh').value = s.nameTh;
    document.getElementById('f-nameEn').value = s.nameEn||'';
    document.getElementById('f-tel').value = s.tel||'';
    document.getElementById('f-zone').value = s.zone||'';
    document.getElementById('drawerTitle').textContent = 'แก้ไขข้อมูลร้าน';
    document.getElementById('drawerSub').textContent = s.nameTh;
    document.getElementById('drawerIcon').innerHTML = '<i class="fas fa-pen-to-square"></i>';
  }else{
    ['f-room','f-nameTh','f-nameEn','f-tel','f-zone'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-floor').value = currentFloor==='ALL' ? '1' : currentFloor;
    document.getElementById('drawerTitle').textContent = 'เพิ่มร้านค้าใหม่';
    document.getElementById('drawerSub').textContent = 'กรอกข้อมูลร้านค้าให้ครบถ้วน';
    document.getElementById('drawerIcon').innerHTML = '<i class="fas fa-store"></i>';
  }
  document.getElementById('drawerBg').classList.add('show');
  document.getElementById('drawer').classList.add('show');
  document.getElementById('fab').classList.add('rot');
}
function closeDrawer(){
  document.getElementById('drawerBg').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('fab').classList.remove('rot');
}

function saveShop(){
  const room = document.getElementById('f-room').value.trim();
  const nameTh = document.getElementById('f-nameTh').value.trim();
  if(!room || !nameTh){
    toast('กรุณากรอกเลขห้องและชื่อร้านให้ครบ','error');
    return;
  }
  const data = {
    room, floor: document.getElementById('f-floor').value,
    nameTh, nameEn: document.getElementById('f-nameEn').value.trim(),
    tel: document.getElementById('f-tel').value.trim(),
    zone: document.getElementById('f-zone').value.trim()
  };
  const idx = parseInt(document.getElementById('editIndex').value, 10);
  const isEdit = idx > -1;
  if(isEdit) shops[idx] = data; else shops.push(data);
  persist();
  closeDrawer();
  render();
  toast(isEdit ? 'แก้ไขข้อมูลเรียบร้อยแล้ว' : 'เพิ่มร้านค้าใหม่เรียบร้อยแล้ว');
  haptic(10);
}

function deleteShop(i){
  const name = shops[i].nameTh;
  if(!confirm(`ยืนยันการลบ "${name}" ?`)) return;
  shops.splice(i,1);
  persist();
  render();
  toast(`ลบ "${name}" แล้ว`, 'info');
}

function resetToDefault(){
  closeExpMenu();
  if(!confirm(`รีเซ็ตข้อมูลกลับเป็น ${DEFAULT_SHOPS.length} ร้านค้าต้นฉบับ?\nข้อมูลที่แก้ไขทั้งหมดจะหายไป`)) return;
  shops = DEFAULT_SHOPS.map(s=>({...s}));
  localStorage.removeItem('sbk_dir_v2');
  render();
  toast('รีเซ็ตข้อมูลต้นฉบับเรียบร้อยแล้ว');
}

/* ══════════ EXPORT / IMPORT ══════════ */
function getFilteredForExport(){
  const kw = currentSearch.toLowerCase().trim();
  return shops.filter(s=>{
    const mf = currentFloor==='ALL' || s.floor===currentFloor;
    const mk = !kw || [s.nameTh,s.room,s.nameEn||'',s.zone||'',s.tel||''].some(v=>v.toLowerCase().includes(kw));
    return mf && mk;
  }).sort((a,b)=> a.floor.localeCompare(b.floor) || a.room.localeCompare(b.room));
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

function exportJSON(){
  closeExpMenu();
  const d = getFilteredForExport();
  const blob = new Blob([JSON.stringify(d,null,2)], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {href:URL.createObjectURL(blob), download:`SBK_Directory_${todayStr()}.json`});
  a.click();
  toast(`ส่งออก JSON แล้ว ${d.length} รายการ`);
}

function exportExcel(){
  closeExpMenu();
  if(typeof XLSX==='undefined'){ toast('โหลดไลบรารี Excel ไม่สำเร็จ ลองใหม่อีกครั้ง','error'); return; }
  const d = getFilteredForExport();
  const hdr = ['ลำดับ','เลขห้อง','ชั้น','ชื่อร้าน (ไทย)','ชื่อร้าน (อังกฤษ)','เบอร์ติดต่อ','บริเวณ / โซน'];
  const rows = d.map((s,i)=>[i+1, s.room, FLOOR_NAME[s.floor]||s.floor, s.nameTh, s.nameEn||'', s.tel||'', s.zone||'']);
  const ws = XLSX.utils.aoa_to_sheet([hdr, ...rows]);
  ws['!cols'] = [{wch:6},{wch:18},{wch:10},{wch:36},{wch:30},{wch:20},{wch:36}];
  const rng = XLSX.utils.decode_range(ws['!ref']);
  for(let c=rng.s.c;c<=rng.e.c;c++){
    const addr = XLSX.utils.encode_cell({r:0,c});
    if(ws[addr]) ws[addr].s = {font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'6D5DF4'}}, alignment:{horizontal:'center',wrapText:true}};
  }
  ws['!freeze'] = {xSplit:0, ySplit:1};
  ws['!autofilter'] = {ref: ws['!ref']};
  const wb = XLSX.utils.book_new();
  const lbl = currentFloor==='ALL' ? 'ทุกชั้น' : 'ชั้น_'+currentFloor;
  XLSX.utils.book_append_sheet(wb, ws, lbl);
  XLSX.writeFile(wb, `SBK_Directory_${todayStr()}_${lbl}.xlsx`);
  toast(`ส่งออก Excel แล้ว ${d.length} รายการ`);
}

function triggerImport(){
  closeExpMenu();
  setTimeout(()=>{ document.getElementById('importFile').click(); }, 120);
}
function importJSON(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    try{
      const imp = JSON.parse(ev.target.result);
      if(!Array.isArray(imp)) throw new Error('not array');
      shops = imp;
      persist();
      render();
      toast(`นำเข้าข้อมูลสำเร็จ ${imp.length} รายการ`);
    }catch(err){
      toast('ไฟล์ JSON ไม่ถูกต้อง กรุณาตรวจสอบไฟล์','error');
    }
    setTimeout(()=>{ try{ e.target.value=''; }catch(_){} }, 200);
  };
  r.readAsText(f);
}

/* ── Export dropdown menu ── */
let expOpen = false;
function toggleExpMenu(e){
  if(e) e.stopPropagation();
  expOpen = !expOpen;
  document.getElementById('expMenu').classList.toggle('open', expOpen);
}
function closeExpMenu(){
  expOpen = false;
  document.getElementById('expMenu').classList.remove('open');
}
document.addEventListener('click', e=>{

});

/* ══════════ DARK MODE ══════════ */
if(localStorage.getItem('sbk_theme')==='dark'){
  document.documentElement.classList.add('dark');
}
function syncThemeIcon(){
  const d = document.documentElement.classList.contains('dark');
  document.getElementById('themeIcon').className = d ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleDark(){
  const d = document.documentElement.classList.toggle('dark');
  localStorage.setItem('sbk_theme', d?'dark':'light');
  syncThemeIcon();
  haptic(8);
}

/* ══════════ TOAST ══════════ */
let _toastTimer;
function toast(msg, type='success'){
  const t = document.getElementById('toast');
  const icon = type==='error' ? 'fa-circle-xmark' : type==='info' ? 'fa-circle-info' : 'fa-circle-check';
  t.innerHTML = `<i class="fas ${icon}"></i> ${escapeHtml(msg)}`;
  t.className = `show ${type==='success'?'':type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2800);
}

/* ══════════ HAPTIC (มือถือ) ══════════ */
function haptic(ms=10){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ── Ripple effect: วงคลื่นกระจายจากจุดแตะ ให้ปุ่มทุกปุ่มดูมีชีวิตชีวาตอนกด ──
   ใช้ event delegation ตัวเดียวที่ document แทนการผูก listener ทีละปุ่ม
   เพราะปุ่มจำนวนมาก (การ์ด/แถวตาราง) ถูกสร้างใหม่ทุกครั้งที่ render() จึงต้อง
   ครอบคลุมปุ่มที่ยังไม่เกิดในตอนโหลดหน้าแรกด้วย */
document.addEventListener('click', e=>{
  if(reduceMotionQuery.matches) return;
  const btn = e.target.closest('button');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement('span');
  span.className = 'ripple-fx';
  span.style.width = span.style.height = size+'px';
  span.style.left = (e.clientX-rect.left-size/2)+'px';
  span.style.top = (e.clientY-rect.top-size/2)+'px';
  btn.appendChild(span);
  setTimeout(()=>span.remove(), 650);
});

/* ══════════ INIT ══════════ */
document.getElementById('searchInput').addEventListener('input', e=>onSearchInput(e.target.value));
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
document.getElementById('viewGridBtn').classList.toggle('on', currentView==='grid');
document.getElementById('viewTableBtn').classList.toggle('on', currentView==='table');
buildElevator();
syncThemeIcon();
render();

/* ── ซ่อนหน้า Intro หลังโชว์ครบเวลา ──
   ใช้ setTimeout แทนการรอ 'load' event เพราะข้อมูลร้านค้าทั้งหมด render()
   เสร็จเร็วมาก (ข้อมูลอยู่ใน localStorage/ตัวแปรในไฟล์ ไม่ต้องรอโหลดจากเน็ต)
   จึงตั้งเวลาคงที่ให้เห็น Intro พอดี ~2 วินาทีตามที่ต้องการ ไม่นานจนน่ารำคาญ */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(()=>{
  const sp = document.getElementById('splash');
  if(sp) sp.classList.add('hide');
}, reduceMotion ? 0 : 2100);
